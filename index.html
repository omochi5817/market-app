<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="相場更新">
<title>相場更新</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --border: #2e2e2e;
    --gold: #c9a84c; --gold-light: #e8c97a; --platinum: #a8b8c8; --silver: #8a9aaa;
    --text: #f0f0f0; --text-muted: #888; --green: #4caf7d; --red: #e05555; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; padding: env(safe-area-inset-top) 20px; }
  .header { padding: 20px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(15,15,15,0.95); backdrop-filter: blur(10px); z-index: 100; }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--gold); }
  .settings-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .main { max-width: 480px; margin: 20px auto; }
  .settings-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: none; }
  .settings-panel.open { display: block; }
  .settings-panel label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
  .settings-panel input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13px; font-family: 'DM Mono', monospace; margin-bottom: 12px; outline: none; }
  .save-btn { background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 10px; font-weight: 700; width: 100%; cursor: pointer; }
  .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px; text-align: center; cursor: pointer; margin-bottom: 20px; position: relative; }
  .upload-area.has-image { border-style: solid; border-color: var(--gold); padding: 0; }
  .upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .preview-img { width: 100%; border-radius: calc(var(--radius) - 2px); display: block; }
  .action-btn { width: 100%; padding: 16px; border-radius: var(--radius); border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-analyze { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #000; }
  .btn-analyze:disabled { opacity: 0.4; }
  .progress { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: none; }
  .progress.show { display: block; }
  .progress-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .progress-step.done { color: var(--green); }
  .progress-step.active { color: var(--gold); }
  .result-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; display: none; overflow: hidden; }
  .result-panel.show { display: block; }
  .result-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; justify-content: space-between; }
  .result-section { padding: 10px 16px; font-size: 11px; background: var(--surface2); color: var(--text-muted); }
  .result-row { display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid rgba(46,46,46,0.5); font-size: 14px; }
  .result-value { font-family: 'DM Mono', monospace; }
  .btn-submit { background: var(--green); color: #fff; }
  .success-msg { background: rgba(76,175,125,0.1); border: 1px solid var(--green); border-radius: var(--radius); padding: 20px; text-align: center; display: none; margin-bottom: 20px; }
  .success-msg.show { display: block; }
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-title"><span>相場</span>更新アプリ</div>
  <button class="settings-btn" onclick="toggleSettings()">⚙ 設定</button>
</div>

<div class="main">
  <div class="settings-panel" id="settingsPanel">
    <label>AI エンジン</label>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button id="btnGemini" onclick="selectEngine('gemini')" style="flex:1;padding:8px;border-radius:8px;border:2px solid var(--gold);background:var(--gold);font-weight:700;cursor:pointer;">Gemini</button>
      <button id="btnClaude" onclick="selectEngine('claude')" style="flex:1;padding:8px;border-radius:8px;border:2px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;">Claude</button>
    </div>
    <label>Gemini API Key</label>
    <input type="password" id="geminiKey" placeholder="AIza...">
    <label>Claude API Key</label>
    <input type="password" id="claudeKey" placeholder="sk-ant-...">
    <label>GAS URL</label>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/...">
    <button class="save-btn" onclick="saveSettings()">保存</button>
  </div>

  <div class="upload-area" id="uploadArea">
    <input type="file" accept="image/*" onchange="handleFile(event)">
    <div id="uploadContent">📷 <strong>画像を選択</strong></div>
    <img id="previewImg" class="preview-img" style="display:none">
  </div>

  <button class="action-btn btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>📊 画像を読み取る</button>

  <div class="progress" id="progressPanel">
    <div class="progress-step" id="step1">🔍 AI解析中...</div>
    <div class="progress-step" id="step2">📋 数値抽出中...</div>
    <div class="progress-step" id="step3">📤 シート書込中...</div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="result-header">取得データ確認 <span id="resultDate" style="color:var(--gold)"></span></div>
    <div id="resultBody"></div>
  </div>

  <button class="action-btn btn-submit" id="submitBtn" onclick="submitToSheet()" style="display:none">✅ シートに書き込む</button>
  <div class="success-msg" id="successMsg">✅ 更新完了</div>
  <button class="action-btn" id="resetBtn" onclick="location.reload()" style="display:none; background:var(--surface2); color:var(--text)">🔄 別の画像</button>
</div>

<script>
let extractedData = null;
let imageBase64 = null;
let imageMediaType = 'image/jpeg';
let currentEngine = localStorage.getItem('nj_engine') || 'gemini';

window.onload = () => {
  document.getElementById('geminiKey').value = localStorage.getItem('nj_gemini_key') || '';
  document.getElementById('claudeKey').value = localStorage.getItem('nj_claude_key') || '';
  document.getElementById('gasUrl').value = localStorage.getItem('nj_gas_url') || '';
  selectEngine(currentEngine);
};

function selectEngine(engine) {
  currentEngine = engine;
  localStorage.setItem('nj_engine', engine);
  const isGem = engine === 'gemini';
  document.getElementById('btnGemini').style.cssText = isGem ? "background:var(--gold);color:#000;border-color:var(--gold);" : "background:transparent;color:var(--text-muted);border-color:var(--border);";
  document.getElementById('btnClaude').style.cssText = !isGem ? "background:var(--gold);color:#000;border-color:var(--gold);" : "background:transparent;color:var(--text-muted);border-color:var(--border);";
}

function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }

function saveSettings() {
  localStorage.setItem('nj_gemini_key', document.getElementById('geminiKey').value.trim());
  localStorage.setItem('nj_claude_key', document.getElementById('claudeKey').value.trim());
  localStorage.setItem('nj_gas_url', document.getElementById('gasUrl').value.trim());
  toggleSettings();
  alert('保存しました');
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    imageBase64 = ev.target.result.split(",")[1];
    imageMediaType = file.type || "image/jpeg";
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('previewImg').style.display = 'block';
    document.getElementById('uploadContent').style.display = 'none';
    document.getElementById('uploadArea').classList.add('has-image');
    document.getElementById('analyzeBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

async function analyze() {
  const apiKey = localStorage.getItem(currentEngine === 'gemini' ? 'nj_gemini_key' : 'nj_claude_key');
  if (!apiKey) return alert('APIキーを設定してください');

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 解析中...';
  document.getElementById('progressPanel').classList.add('show');
  
  const prompt = `相場表から数値をJSONで抽出。{ "date":"M/D", "gold_spot":数字, "k24":数字, "k18":数字, "pt1000":数字, "pt900":数字, "sv1000":数字, "pd":数字 } 等の形式。不明はnull。JSONのみ回答。`;

  try {
    let text;
    if (currentEngine === 'gemini') {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: imageMediaType, data: imageBase64 } }] }] })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'Gemini Error');
      text = data.candidates[0].content.parts[0].text;
    } else {
      // Claudeのリクエストを「最初のコード」に合わせる
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({
          model: 'claude-3-5-sonnet-20240620',
          max_tokens: 1000,
          messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: imageMediaType, data: imageBase64 } }, { type: 'text', text: prompt }] }]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'Claude Error');
      text = data.content[0].text;
    }

    extractedData = JSON.parse(text.match(/\{[\s\S]*\}/)[0]);
    document.getElementById('step1').classList.add('done');
    showResult(extractedData);
    btn.innerHTML = '📊 再読み取り';
    btn.disabled = false;
  } catch (err) {
    alert('エラー: ' + err.message);
    btn.disabled = false;
    btn.innerHTML = '📊 画像を読み取る';
  }
}

function showResult(data) {
  document.getElementById('resultDate').textContent = data.date || '-';
  let html = '';
  for (let k in data) {
    if(k==='date' || data[k]===null) continue;
    html += `<div class="result-row"><span>${k}</span><span class="result-value">${data[k].toLocaleString()}円</span></div>`;
  }
  document.getElementById('resultBody').innerHTML = html;
  document.getElementById('resultPanel').classList.add('show');
  document.getElementById('submitBtn').style.display = 'flex';
  document.getElementById('resetBtn').style.display = 'flex';
}

async function submitToSheet() {
  const url = localStorage.getItem('nj_gas_url');
  if(!url) return alert('GAS URLを設定してください');
  document.getElementById('submitBtn').disabled = true;
  const params = new URLSearchParams(extractedData).toString();
  try {
    await fetch(`${url}?${params}`, { mode: 'no-cors' });
    document.getElementById('successMsg').classList.add('show');
    document.getElementById('submitBtn').style.display = 'none';
  } catch(e) { alert('書込失敗'); document.getElementById('submitBtn').disabled = false; }
}
</script>
</body>
</html>
