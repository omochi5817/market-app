<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相場更新">
<title>相場更新</title>
<style>
:root{--bg:#0f0f0f;--sur:#1a1a1a;--sur2:#242424;--bdr:#2e2e2e;--gold:#c9a84c;--pt:#a8b8c8;--sv:#8a9aaa;--tx:#f0f0f0;--mu:#888;--gn:#4caf7d;--rd:#e05555;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:sans-serif;min-height:100vh;}
.tabs{display:flex;border-bottom:1px solid var(--bdr);background:var(--sur);position:sticky;top:0;z-index:100;}
.tab{flex:1;padding:13px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);}
.pg{display:none;padding:12px;}
.pg.on{display:block;}
.total-bar{background:rgba(201,168,76,.1);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.tb-item{text-align:center;}
.tb-item .tl{font-size:10px;color:var(--mu);margin-bottom:2px;}
.tb-item .tv{font-size:16px;font-weight:700;font-family:monospace;}
.tv-max{color:var(--gold);}.tv-buy{color:var(--gn);}.tv-profit{color:var(--pt);}
.tbl-wrap{overflow-x:auto;margin-bottom:10px;border-radius:var(--r);border:1px solid var(--bdr);}
table{border-collapse:collapse;min-width:100%;}
thead tr{background:var(--sur2);}
thead th{padding:7px 4px;font-size:10px;color:var(--mu);white-space:nowrap;border-bottom:2px solid var(--bdr);text-align:center;}
tbody tr{border-bottom:1px solid var(--bdr);}
tbody tr:last-child{border-bottom:none;}
tbody tr:nth-child(even){background:rgba(255,255,255,.02);}
tbody td{padding:5px 3px;text-align:center;font-size:12px;vertical-align:middle;}
tbody td:first-child{color:var(--mu);font-size:10px;padding:5px 6px;}
td select,td input[type=number],td input[type=text]{background:var(--bg);border:1px solid var(--bdr);border-radius:5px;color:var(--tx);padding:5px 3px;font-size:12px;width:100%;text-align:center;outline:none;}
td select:focus,td input:focus{border-color:var(--gold);}
.c-jk{color:var(--mu);font-family:monospace;font-size:11px;}
.c-max{color:var(--gold);font-weight:700;font-family:monospace;}
.c-profit{color:var(--pt);font-family:monospace;font-size:11px;}
.c-note{color:var(--rd);font-size:10px;margin-top:2px;}
.del-btn{background:rgba(224,85,85,.15);color:var(--rd);border:1px solid rgba(224,85,85,.3);border-radius:4px;padding:3px 6px;cursor:pointer;font-size:11px;}
.btn{border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.btn-gold{background:var(--gold);color:#000;width:100%;}
.btn-gray{background:var(--sur2);color:var(--mu);border:1px solid var(--bdr);width:100%;}
.btn-green{background:var(--gn);color:#fff;width:100%;}
.btn:disabled{opacity:.4;}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.card h3{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.pg_grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.pi-box{background:var(--sur2);border-radius:6px;padding:7px 9px;}
.pi-box .pl{font-size:10px;color:var(--mu);}
.pi-box .pv{font-size:13px;font-weight:700;font-family:monospace;}
.gold-v{color:var(--gold);}.pt-v{color:var(--pt);}.sv-v{color:var(--sv);}
.upload{border:2px dashed var(--bdr);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;position:relative;overflow:hidden;margin-bottom:10px;}
.upload.has-img{padding:0;border-color:var(--gold);border-style:solid;}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;margin:0;}
.upload img{width:100%;display:block;border-radius:8px;}
.steps{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:10px;margin-bottom:10px;display:none;}
.steps.show{display:block;}
.step{padding:5px 0;font-size:12px;color:var(--mu);border-bottom:1px solid var(--bdr);}
.step:last-child{border-bottom:none;}
.step.ok{color:var(--gn);}.step.go{color:var(--gold);}.step.ng{color:var(--rd);}
.sbar{background:var(--sur2);border:1px solid var(--bdr);border-radius:7px;padding:7px 11px;font-size:11px;color:var(--mu);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--rd);flex-shrink:0;}
.sdot.ok{background:var(--gn);}
.ok-msg{background:rgba(76,175,125,.1);border:1px solid var(--gn);border-radius:var(--r);padding:12px;text-align:center;display:none;margin-bottom:10px;color:var(--gn);font-weight:700;font-size:13px;}
.ok-msg.show{display:block;}
.fp label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px;text-transform:uppercase;}
.fp input{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:7px;color:var(--tx);padding:9px 10px;font-size:13px;margin-bottom:9px;outline:none;}
.eng{display:flex;gap:7px;margin-bottom:10px;}
.eng button{flex:1;padding:7px;border-radius:7px;border:2px solid var(--bdr);background:transparent;color:var(--mu);font-weight:700;cursor:pointer;font-size:12px;}
.eng button.on{background:var(--gold);color:#000;border-color:var(--gold);}
</style>
</head>
<body>

<div class="tabs">
  <div class="tab on" onclick="showTab('t1',this)">📷 相場</div>
  <div class="tab" onclick="showTab('t2',this)">💰 査定</div>
  <div class="tab" onclick="showTab('t3',this)">⚙ 設定</div>
</div>

<div class="pg on" id="t1">
  <div class="sbar"><div class="sdot" id="sd1"></div><span id="st1">相場未取得</span></div>
  <div class="upload" id="ua"><input type="file" accept="image/*" onchange="onFile(event)">
    <div id="uc" style="font-size:13px;color:var(--mu)">📷 相場表画像を選択</div>
    <img id="pi" style="display:none">
  </div>
  <button class="btn btn-gold" id="ab" onclick="doAnalyze()" disabled>📊 画像を読み取る</button>
  <div class="steps" id="st">
    <div class="step" id="s1">🔍 AI解析中...</div>
    <div class="step" id="s2">📋 数値抽出中...</div>
    <div class="step" id="s3">📤 シート書込中...</div>
  </div>
  <div id="pv" style="display:none">
    <div class="card"><h3>金スクラップ <span id="pdate" style="color:var(--gold)"></span></h3><div class="pg_grid" id="pg_g"></div></div>
    <div class="card"><h3>Ptスクラップ</h3><div class="pg_grid" id="pg_p"></div></div>
    <div class="card"><h3>銀・Pd</h3><div class="pg_grid" id="pg_s"></div></div>
    <button class="btn btn-green" id="wb" onclick="doWrite()" style="display:none">📤 シートに書き込む</button>
    <div class="ok-msg" id="wok">✅ シートに書き込みました</div>
  </div>
</div>

<div class="pg" id="t2">
  <div class="sbar"><div class="sdot" id="sd2"></div><span id="st2">相場未取得</span></div>
  <div class="total-bar">
    <div class="tb-item"><div class="tl">合計MAX</div><div class="tv tv-max" id="totalMax">¥0</div></div>
    <div class="tb-item"><div class="tl">買取MAX</div><div class="tv tv-buy" id="totalBuy">¥0</div></div>
    <div class="tb-item"><div class="tl">粗利MAX</div><div class="tv tv-profit" id="totalProfit">¥0</div></div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th style="min-width:92px">種類</th>
          <th style="min-width:120px">品位・品目</th>
          <th style="min-width:56px">重さ(g)</th>
          <th style="min-width:52px">石引(g)</th>
          <th style="min-width:50px">地金(g)</th>
          <th style="min-width:70px">地金MAX</th>
          <th style="min-width:62px">先付け</th>
          <th style="min-width:70px">MAX</th>
          <th style="min-width:68px">買取</th>
          <th style="min-width:62px">粗利</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ab2"></tbody>
    </table>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-gold" style="flex:1" onclick="addRow()">＋ 行追加</button>
    <button class="btn btn-gray" style="flex:1;margin-bottom:8px" onclick="clearRows()">🗑 クリア</button>
  </div>
</div>

<div class="pg" id="t3">
  <div class="card fp">
    <h3>AIエンジン</h3>
    <div class="eng"><button id="bg" class="on" onclick="setEng('gemini')">Gemini(無料)</button><button id="bc" onclick="setEng('claude')">Claude(有料)</button></div>
    <label>Gemini API Key</label><input type="password" id="gk" placeholder="AIza...">
    <label>Claude API Key</label><input type="password" id="ck" placeholder="sk-ant-...">
    <label>GAS デプロイURL</label><input type="text" id="gu" placeholder="https://script.google.com/...">
    <button class="btn btn-gold" onclick="save()">保存</button>
  </div>
</div>

function getUnitPrice(gradeName, weight) {
  if (!mkt || !gradeName) return 0;
  var g = GRADES.find(function(x){ return !x.g && x.n===gradeName; });
  if (!g) return 0;
  var base = mkt[g.base] ? Number(mkt[g.base]) : 0;
  if (g.type==='gdb') {
    if (weight < 5) return mkt['k24'] ? Number(mkt['k24']) : 0;
    if (weight >= 200) return Math.max(0, base-100);
    return base;
  }
  if (g.type==='coin_domestic') return Math.floor(base * 0.97);
  if (g.type==='coin_foreign') return base;
  if (g.type==='kihei') return base + 100;
  return base;
}

function getNote(gradeName, weight) {
  if (!gradeName) return '';
  var g = GRADES.find(function(x){ return !x.g && x.n===gradeName; });
  if (!g) return '';
  if (g.type==='gdb' && weight < 5) return '5g未満→S';
  if (g.type==='gdb' && weight >= 200) return '200g以上-100';
  if (g.type==='coin_domestic') return 'floor(IG×0.97)';
  if (g.type==='kihei') return 'IG+100';
  return '';
}

window.onload=function(){
  document.getElementById('gk').value=localStorage.getItem('gk')||'';
  document.getElementById('ck').value=localStorage.getItem('ck')||'';
  document.getElementById('gu').value=localStorage.getItem('gu')||'';
  setEng(eng);
  var s=localStorage.getItem('mkt');
  if(s){ mkt=JSON.parse(s); updateStatus(); }
  for(var i=0;i<10;i++) addRow();
};

function showTab(id,el){
  document.querySelectorAll('.pg').forEach(function(e){e.classList.remove('on');});
  document.querySelectorAll('.tab').forEach(function(e){e.classList.remove('on');});
  document.getElementById(id).classList.add('on'); el.classList.add('on');
  if(id==='t2') renderTable();
}

function setEng(e){ eng=e; localStorage.setItem('eng',e); document.getElementById('bg').className=e==='gemini'?'on':''; document.getElementById('bc').className=e==='claude'?'on':''; }
function save(){ localStorage.setItem('gk',document.getElementById('gk').value.trim()); localStorage.setItem('ck',document.getElementById('ck').value.trim()); localStorage.setItem('gu',document.getElementById('gu').value.trim()); alert('保存しました'); }

function updateStatus(){
  if(!mkt) return;
  var txt=(mkt.date||'')+'の相場取得済み';
  ['sd1','sd2'].forEach(function(id){ var el=document.getElementById(id); if(el) el.className='sdot ok'; });
  ['st1','st2'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=txt; });
  showPriceView();
  renderTable();
}

function onFile(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){
    b64=ev.target.result.split(',')[1]; mime=f.type||'image/jpeg';
    document.getElementById('pi').src=ev.target.result; document.getElementById('pi').style.display='block';
    document.getElementById('uc').style.display='none'; document.getElementById('ua').className='upload has-img';
    document.getElementById('ab').disabled=false;
  };
  r.readAsDataURL(f);
}

function ss(id,cls){ document.getElementById(id).className='step '+cls; }
function getPrompt(){ return 'この相場表画像から数値をJSONで抽出。不明はnull、数値は整数、JSONのみ返す。キー: date(M/D), gold_spot, k24, k23, k22, k216, k20, k18, k14, k10, k9, k8, k5, kiba, pt_ig, pt1000, pt950, pt900, pt850, sv_ig, sv1000, sv925, sv, pd, c950_19, c950_37, c950_55, c950_73, c950_91, c900_19, c900_37, c900_55, c900_73, c900_91, c850_19, c850_37, c850_55, c850_73, c850_91, sv_k18, sv_k14, sv_k10'; }

async function doAnalyze(){
  var key=localStorage.getItem(eng==='gemini'?'gk':'ck');
  if(!key) return alert('APIキーを設定してください');
  if(!b64) return alert('画像を選択してください');
  document.getElementById('ab').disabled=true; document.getElementById('ab').textContent='解析中...';
  document.getElementById('st').classList.add('show'); document.getElementById('pv').style.display='none';
  ss('s1','go'); ss('s2',''); ss('s3','');
  try{
    var text;
    if(eng==='gemini'){
      var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:getPrompt()},{inline_data:{mime_type:mime,data:b64}}]}]})});
      var d=await res.json(); if(!res.ok) throw new Error('Gemini: '+(d.error&&d.error.message||JSON.stringify(d.error)));
      text=d.candidates[0].content.parts[0].text;
    }else{
      var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:getPrompt()}]}]})});
      var d=await res.json(); if(!res.ok) throw new Error('Claude: '+(d.error&&d.error.message||JSON.stringify(d.error)));
      text=d.content[0].text;
    }
    ss('s1','ok'); ss('s2','go');
    var m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error('JSONが見つかりません');
    mkt=JSON.parse(m[0]); localStorage.setItem('mkt',JSON.stringify(mkt));
    ss('s2','ok'); updateStatus();
    document.getElementById('wb').style.display='block'; document.getElementById('wok').classList.remove('show');
    document.getElementById('ab').disabled=false; document.getElementById('ab').textContent='📊 再読み取り';
  }catch(err){
    ss('s1','ng'); alert('エラー: '+err.message);
    document.getElementById('ab').disabled=false; document.getElementById('ab').textContent='📊 画像を読み取る';
  }
}

function showPriceView(){
  if(!mkt) return;
  document.getElementById('pdate').textContent=mkt.date||'';
  function rg(id,pairs,cls){
    var el=document.getElementById(id); el.innerHTML='';
    pairs.forEach(function(p){ var v=mkt[p[1]]; if(v==null) return; el.innerHTML+='<div class="pi-box"><div class="pl">'+p[0]+'</div><div class="pv '+cls+'">'+Number(v).toLocaleString()+'</div></div>'; });
  }
  rg('pg_g',[['金スポット','gold_spot'],['K24(S)','k24'],['K23','k23'],['K22','k22'],['K21.6','k216'],['K20','k20'],['K18','k18'],['K14','k14'],['K10','k10'],['K9','k9'],['K8','k8'],['K5','k5'],['金歯','kiba']],'gold-v');
  rg('pg_p',[['Pt地金','pt_ig'],['Pt1000','pt1000'],['Pt950','pt950'],['Pt900','pt900'],['Pt850','pt850']],'pt-v');
  rg('pg_s',[['Sv地金','sv_ig'],['Sv1000','sv1000'],['Sv925','sv925'],['SV','sv'],['Pd','pd']],'sv-v');
  document.getElementById('pv').style.display='block';
}

async function doWrite(){
  var url=localStorage.getItem('gu'); if(!url) return alert('GAS URLを設定してください'); if(!mkt) return;
  ss('s3','go');
  var params=Object.keys(mkt).filter(function(k){ return mkt[k]!=null; }).map(function(k){ return k+'='+encodeURIComponent(mkt[k]); }).join('&');
  try{
    await fetch(url+'?sheet=honbu&'+params,{mode:'no-cors'});
    ss('s3','ok'); document.getElementById('wok').classList.add('show'); document.getElementById('wb').style.display='none';
  }catch(e){ ss('s3','ng'); alert('書込エラー: '+e.message); }
}

// ===== 査定表 =====
function addRow(){ rows.push({id:rid++,type:'',grade:'',w:0,ishi:0,saki:0,buy:0}); renderTable(); }
function clearRows(){ rows=[]; rid=0; for(var i=0;i<10;i++) addRow(); }

function getDisplayPrice(g){
  if(!mkt||!g.base||!mkt[g.base]) return 0;
  var base=Number(mkt[g.base]);
  if(g.type==='gdb') return base; // 重さ依存なので基本値表示
  if(g.type==='coin_domestic') return Math.floor(base*0.97);
  if(g.type==='coin_foreign') return base;
  if(g.type==='kihei') return base+100;
  return base;
}

function gradeOpts(sel){
  var h='<option value="">-- 品位 --</option>';
  GRADES.forEach(function(g){
    if(g.g){ h+='<option disabled style="color:var(--gold);font-size:10px">'+g.g+'</option>'; return; }
    var p=getDisplayPrice(g);
    var label=g.n+(p?' '+p.toLocaleString():'');
    h+='<option value="'+g.n+'"'+(sel===g.n?' selected':'')+'>'+label+'</option>';
  });
  return h;
}

function calcRow(r){
  var w=r.w||0;
  var jk=Math.max(0, w-(r.ishi||0));
  var unit=getUnitPrice(r.grade, w);
  var jmax=Math.round(unit*jk);
  var max=Math.max(jmax, r.saki||0);
  var profit=max-(r.buy||0);
  var note=getNote(r.grade, w);
  return {jk:jk, jmax:jmax, max:max, profit:profit, note:note};
}

function renderTable(){
  var tbody=document.getElementById('ab2');
  if(!tbody) return;
  tbody.innerHTML='';
  var tMax=0, tBuy=0, tProfit=0;
  rows.forEach(function(r,i){
    var c=calcRow(r);
    tMax+=c.max; tBuy+=r.buy||0; tProfit+=c.profit;
    var tr=document.createElement('tr');
    var pStyle=c.profit<0?' style="color:var(--rd)"':'';
    // datalist id per row
    var dlId='dl_'+r.id;
    tr.innerHTML=
      '<td>'+(i+1)+'</td>'+
      '<td>'+
        '<input list="'+dlId+'" value="'+(r.type||'')+'" placeholder="種類" onchange="upd('+r.id+',\'type\',this.value)" oninput="upd('+r.id+',\'type\',this.value)" style="width:90px">'+
        '<datalist id="'+dlId+'">'+TYPES.map(function(t){return '<option value="'+t+'">';}).join('')+'</datalist>'+
      '</td>'+
      '<td>'+
        '<select onchange="upd('+r.id+',\'grade\',this.value)" style="min-width:110px">'+gradeOpts(r.grade)+'</select>'+
        (c.note?'<div class="c-note">'+c.note+'</div>':'')+
      '</td>'+
      '<td><input type="number" step="0.1" min="0" value="'+(r.w||'')+'" placeholder="0" onchange="upd('+r.id+',\'w\',this.value)" style="width:54px"></td>'+
      '<td><input type="number" step="0.1" min="0" value="'+(r.ishi||'')+'" placeholder="0" onchange="upd('+r.id+',\'ishi\',this.value)" style="width:50px"></td>'+
      '<td class="c-jk">'+c.jk.toFixed(1)+'g</td>'+
      '<td class="c-max">'+c.jmax.toLocaleString()+'</td>'+
      '<td><input type="number" value="'+(r.saki||'')+'" placeholder="0" onchange="upd('+r.id+',\'saki\',this.value)" style="width:60px"></td>'+
      '<td class="c-max" style="font-size:13px">'+c.max.toLocaleString()+'</td>'+
      '<td><input type="number" value="'+(r.buy||'')+'" placeholder="0" onchange="upd('+r.id+',\'buy\',this.value)" style="width:60px"></td>'+
      '<td class="c-profit"'+pStyle+'>'+c.profit.toLocaleString()+'</td>'+
      '<td><button class="del-btn" onclick="delRow('+r.id+')">✕</button></td>';
    tbody.appendChild(tr);
  });
  document.getElementById('totalMax').textContent='¥'+tMax.toLocaleString();
  document.getElementById('totalBuy').textContent='¥'+tBuy.toLocaleString();
  document.getElementById('totalProfit').textContent='¥'+tProfit.toLocaleString();
}

function upd(id,field,val){
  var r=rows.find(function(x){ return x.id===id; }); if(!r) return;
  if(field==='type') r.type=val;
  else if(field==='grade') r.grade=val;
  else r[field]=parseFloat(val)||0;
  renderTable();
}

function delRow(id){ rows=rows.filter(function(x){ return x.id!==id; }); renderTable(); }
</script>
